<main class="login-page">
  <section class="login-card">
    <span class="eyebrow">Skate Supply</span>

    <h1>Sign in to the inventory portal</h1>

    <p>
      Use your Google account to access warehouse tools, product data, and inventory actions.
    </p>

    <button type="button" class="google-btn" (click)="login()">
      Sign in with Google
    </button>

    <p class="helper-text">
      After sign-in, employees will be routed directly to the warehouse inventory page.
    </p>
  </section>
</main>
