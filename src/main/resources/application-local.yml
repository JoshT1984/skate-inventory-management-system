spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skatedb}
    username: ${DB_USERNAME:skate_user}
    password: ${DB_PASSWORD:postgres}
  session:
    store-type: none
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "http://localhost:8080/api/login/oauth2/code/{registrationId}"
server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
