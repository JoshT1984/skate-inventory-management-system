spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.session.jdbc.JdbcSessionAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skatedb}
    username: ${DB_USERNAME:skate_user}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  session:
    store-type: none

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: http://localhost:8080/api/login/oauth2/code/{registrationId}

server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false
        http-only: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

logging:
  level:
    com.skillstorm: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.hibernate.SQL: DEBUG
